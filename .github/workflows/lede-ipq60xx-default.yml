# LEDE 6.18 images for NN6000 v2 and ZN M2.
#
# ZN M2 and NN6000 v2 both use WIFI-NO. Kernels stay on the default gzip FIT.
name: LEDE 6.18 - NN6000 v2 and ZN M2

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/lede-ipq60xx-default.yml'
      - '.github/ci/daede-deps.txt'
      - '.github/ci/zn-m2-boot.py'
      - 'target/linux/qualcommax/**'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.profile }}
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: nn6000-v2
            device: link_nn6000-v2
            boot: wifi-no
          - profile: zn-m2
            device: zn_m2
            boot: wifi-no
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout LEDE
        uses: actions/checkout@v4

      - name: Prepare build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update
          sudo apt-get install -y \
            build-essential binutils bison bzip2 ccache clang cmake cpio curl \
            device-tree-compiler dwarves flex gawk gcc-multilib g++-multilib gettext git \
            gperf help2man intltool libelf-dev libfuse-dev libglib2.0-dev \
            libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev \
            libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool \
            llvm ninja-build patch pkgconf python3 python3-pyelftools \
            python3-setuptools rsync scons squashfs-tools subversion swig \
            texinfo uglifyjs unzip wget xmlto xxd zlib1g-dev \
            antlr3 asciidoc autoconf automake autopoint genisoimage \
            libc6-dev-i386 p7zip-full qemu-utils
          sudo apt-get clean
          sudo timedatectl set-timezone Asia/Shanghai
          df -h

      - name: Install LEDE default feeds
        run: |
          set -euo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Remove WiFi packages
        if: matrix.boot == 'wifi-no'
        run: |
          set -euo pipefail
          python3 .github/ci/zn-m2-boot.py
          git diff --stat -- target/linux/qualcommax

      - name: Configure this device
        run: |
          set -euo pipefail
          cat > .config <<EOF
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_${{ matrix.device }}=y
          # CONFIG_TARGET_MULTI_PROFILE is not set
          # CONFIG_TARGET_PER_DEVICE_ROOTFS is not set
          CONFIG_TESTING_KERNEL=y
          EOF
          if [ "${{ matrix.boot }}" = "wifi-no" ]; then
            cat >> .config <<'EOF'
          CONFIG_PACKAGE_kmod-ath=n
          CONFIG_PACKAGE_kmod-ath11k=n
          CONFIG_PACKAGE_kmod-ath11k-ahb=n
          CONFIG_PACKAGE_kmod-ath11k-pci=n
          CONFIG_PACKAGE_ath11k-firmware-ipq6018=n
          CONFIG_PACKAGE_ath11k-firmware-ipq6018-ddwrt=n
          CONFIG_PACKAGE_ath11k-firmware-qcn9074=n
          CONFIG_PACKAGE_wpad-openssl=n
          CONFIG_PACKAGE_ipq-wifi-zn_m2=n
          CONFIG_PACKAGE_ipq-wifi-link_nn6000=n
          EOF
          fi
          cat .github/ci/daede-deps.txt >> .config
          make defconfig
          grep -qx 'CONFIG_TESTING_KERNEL=y' .config
          grep -qx 'CONFIG_LINUX_6_18=y' .config
          python3 - <<'PY'
          from pathlib import Path
          config = Path('.config').read_text().splitlines()
          required = Path('.github/ci/daede-deps.txt').read_text().splitlines()
          missing = [line for line in required if line.startswith('CONFIG_') and line.endswith('=y') and line not in config]
          conflicts = [line for line in required if line.startswith('# CONFIG_') and line.endswith(' is not set') and line.replace('# ', '').replace(' is not set', '=y') in config]
          if missing or conflicts:
              raise SystemExit('DAEDE dependency mismatch: missing=' + repr(missing) + ' conflicts=' + repr(conflicts))
          PY
          if ! grep -qx "CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_${{ matrix.device }}=y" .config \
            && ! grep -qx "CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_${{ matrix.device }}=y" .config; then
            echo "device ${{ matrix.device }} was not selected" >&2
            grep -E 'CONFIG_TARGET_.*DEVICE_' .config || true
            exit 1
          fi
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path
          text = Path("target/linux/qualcommax/image/ipq60xx.mk").read_text()
          block = re.search(r"(?ms)^define Device/zn_m2\n.*?^endef$", text)
          if not block or "\t$(call Device/FitImage)\n" not in block.group() or "FitImageLzma" in block.group():
              sys.exit("ZN M2 kernel is not the default gzip FIT")
          if "UbiFit" not in block.group():
              sys.exit("ZN M2 lost its UBI layout")
          dts_dir = Path("target/linux/qualcommax/files/arch/arm64/boot/dts/qcom")
          board = (dts_dir / "ipq6018-m2.dts").read_text()
          cmiot = (dts_dir / "ipq6018-viking-cmiot.dtsi").read_text()
          if '"ipq6018-viking-cmiot.dtsi"' not in board or '"ipq6018-common.dtsi"' not in cmiot:
              sys.exit("ZN M2 is not using the VIKINGYFY DTS include chain")
          if "ipq6018-512m.dtsi" in cmiot or "qcom,smem-part" not in cmiot:
              sys.exit("ZN M2 RAM carveout or NAND SMEM configuration differs from this trial")
          if "ath11k-fw-memory-mode = <1>" not in board:
              sys.exit("ZN M2 ath11k firmware memory mode is missing")
          patch = Path("target/linux/qualcommax/patches-6.18/0911-arm64-dts-qcom-ipq6018-use-secure-WCSS-remoteproc.patch")
          if "qcom,ipq6018-wcss-sec-pil" not in patch.read_text():
              sys.exit("ZN M2 secure WCSS patch is missing from 6.18")
          PY
          if [ "${{ matrix.boot }}" = "wifi-no" ]; then
            for symbol in \
              CONFIG_PACKAGE_kmod-ath11k \
              CONFIG_PACKAGE_kmod-ath11k-ahb \
              CONFIG_PACKAGE_ath11k-firmware-ipq6018 \
              CONFIG_PACKAGE_wpad-openssl \
              CONFIG_PACKAGE_ipq-wifi-zn_m2 \
              CONFIG_PACKAGE_ipq-wifi-link_nn6000
            do
              if grep -Eq "^${symbol}=[ym]$" .config; then
                echo "${symbol} is still selected" >&2
                exit 1
              fi
            done
          fi
          mkdir -p build-info
          cp .config build-info/build.config
          ./scripts/diffconfig.sh > build-info/diffconfig.txt
          git rev-parse HEAD > build-info/source-commit.txt
          ./scripts/feeds list -s > build-info/feeds.txt
          {
            echo "BUILD_DATE=$(TZ=Asia/Shanghai date +%y.%m.%d-%H.%M)"
            echo "SOURCE_COMMIT=$(git rev-parse HEAD)"
          } >> "$GITHUB_ENV"

      - name: Download sources
        run: |
          set -euo pipefail
          make download -j8 2>&1 | tee build-info/download.log

      - name: Build firmware
        run: |
          set -euo pipefail
          { make -j"$(nproc)" || make -j1 V=s; } 2>&1 | tee build-info/build.log

      - name: Verify kernel BTF
        run: |
          set -euo pipefail
          vmlinux=$(find build_dir -type f -name vmlinux -print -quit)
          if [ -z "$vmlinux" ] || ! readelf --wide --sections "$vmlinux" | grep -q '\.BTF'; then
            echo 'built kernel is missing vmlinux BTF required by dae/daed' >&2
            exit 1
          fi

      - name: Verify firmware output
        run: |
          set -euo pipefail
          dest=bin/targets/qualcommax/ipq60xx
          find "$dest" -maxdepth 1 -type f -printf '%s\t%p\n' | sort -n | tee build-info/images.txt
          if ! find "$dest" -maxdepth 1 -type f -name "*${{ matrix.device }}*sysupgrade*" -print -quit | grep -q .; then
            echo "missing sysupgrade image for ${{ matrix.device }}" >&2
            exit 1
          fi
          if [ "${{ matrix.profile }}" = "zn-m2" ]; then
            factory=$(find "$dest" -maxdepth 1 -type f -name "*${{ matrix.device }}*factory.ubi" -print -quit)
            if [ -z "$factory" ]; then
              echo 'missing ZN M2 factory.ubi' >&2
              exit 1
            fi
            size=$(stat -c%s "$factory")
            if [ "$size" -gt $((95 * 1024 * 1024)) ]; then
              echo "factory.ubi is ${size} bytes and cannot be uploaded by the stock U-Boot web recovery (95MiB)" >&2
              exit 1
            fi
          else
            if ! find "$dest" -maxdepth 1 -type f -name "*${{ matrix.device }}*factory.bin" -print -quit | grep -q .; then
              echo 'missing NN6000 v2 factory.bin' >&2
              exit 1
            fi
          fi

      - name: Stage release files
        run: |
          set -euo pipefail
          mkdir -p upload
          dest=bin/targets/qualcommax/ipq60xx
          find "$dest" -maxdepth 1 -type f \
            \( -name "*${{ matrix.device }}*" -o -name 'sha256sums' -o -name '*.manifest' -o -name '*.buildinfo' \) \
            ! -name 'packages' \
            -exec cp -t upload {} +
          cp build-info/build.config "upload/config-${{ matrix.profile }}-${BUILD_DATE}.txt"
          cp build-info/diffconfig.txt "upload/diffconfig-${{ matrix.profile }}-${BUILD_DATE}.txt"
          (
            cd upload
            sha256sum -- * > SHA256SUMS
          )
          if [ "${{ matrix.profile }}" = "zn-m2" ]; then
            cat > release-notes.md <<EOF
          LEDE 内核 6.18，单设备编译 ZN M2。内核是 VIKINGYFY 默认的 gzip FIT，不是 LZMA。软件包是 WIFI-NO，不带无线。

          ROM 是 128MB，固件不写死闪存容量，UBI 刷进 SMEM 报出的 rootfs 分区。512MB 和 1GB 内存共用这一份，容量由 U-Boot 按 CDT 填入。

          刷机：
          - U-Boot / 救砖：\`*-factory.ubi\`（原厂网页恢复不要超过 95MB）
          - 已经在 OpenWrt 里：\`*-sysupgrade.bin\`
          不要刷 NN6000 的 factory.bin。此版本不带无线。

          源码提交：${SOURCE_COMMIT}
          编译时间：${BUILD_DATE} Asia/Shanghai
          登录地址和密码沿用 LEDE 默认设置。
          EOF
          else
            cat > release-notes.md <<EOF
          LEDE 内核 6.18，单设备编译 Link NN6000 v2。内核是默认 gzip FIT。软件包是 WIFI-NO，不带无线。f2fs 工具保留。

          不与 ZN M2 混编。内存容量由 U-Boot 按 CDT 填入，2GB 不在设备树里写死。

          刷机：
          - 首次 / 救砖：\`*-factory.bin\`
          - 系统内升级：\`*-sysupgrade.bin\`
          不要刷 ZN M2 的 factory.ubi。此版本不带无线。

          源码提交：${SOURCE_COMMIT}
          编译时间：${BUILD_DATE} Asia/Shanghai
          登录地址和密码沿用 LEDE 默认设置。
          EOF
          fi

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: lede-6.18-${{ matrix.profile }}-${{ env.BUILD_DATE }}
          path: |
            upload/
            release-notes.md
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lede-6.18-${{ matrix.profile }}-${{ env.BUILD_DATE }}-${{ github.run_id }}
          name: LEDE 6.18 ${{ matrix.profile }} ${{ env.BUILD_DATE }}
          body_path: release-notes.md
          files: |
            upload/*.bin
            upload/*.ubi
            upload/*.itb
            upload/*.manifest
            upload/*.buildinfo
            upload/*.txt
            upload/SHA256SUMS
          fail_on_unmatched_files: false
          make_latest: false
