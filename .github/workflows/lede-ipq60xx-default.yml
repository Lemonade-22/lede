# LEDE 6.12 images for NN6000 v2 and ZN M2.
#
# A combined "LEDE default" build does not boot on ZN M2: that board has
# 256MB RAM, a 40MB Q6 reservation, ath11k in the target defaults, and a
# gzip FIT. OpenWRT-CI_Self's ZN-M2-WIFI-NO profile builds this device
# alone, drops WiFi, and switches the FIT to LZMA. NN6000 v2 stays on the
# untouched LEDE defaults. Each profile is published as a GitHub Release;
# Actions artifacts are only a 14-day copy.
name: LEDE 6.12 - NN6000 v2 and ZN M2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.profile }}
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: nn6000-v2
            device: link_nn6000-v2
            boot: default
          - profile: zn-m2
            device: zn_m2
            boot: wifi-no
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout LEDE
        uses: actions/checkout@v4

      - name: Prepare build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo apt-get update
          sudo apt-get install -y \
            build-essential binutils bison bzip2 ccache clang cmake cpio curl \
            device-tree-compiler flex gawk gcc-multilib g++-multilib gettext git \
            gperf help2man intltool libelf-dev libfuse-dev libglib2.0-dev \
            libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev \
            libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool \
            llvm ninja-build patch pkgconf python3 python3-pyelftools \
            python3-setuptools rsync scons squashfs-tools subversion swig \
            texinfo uglifyjs unzip wget xmlto xxd zlib1g-dev \
            antlr3 asciidoc autoconf automake autopoint genisoimage \
            libc6-dev-i386 p7zip-full qemu-utils
          sudo apt-get clean
          sudo timedatectl set-timezone Asia/Shanghai
          df -h

      - name: Install LEDE default feeds
        run: |
          set -euo pipefail
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Adapt ZN M2 for 256MB NAND boot
        if: matrix.boot == 'wifi-no'
        run: |
          set -euo pipefail
          python3 .github/ci/zn-m2-boot.py
          git diff --stat -- target/linux/qualcommax

      - name: Configure this device
        run: |
          set -euo pipefail
          cat > .config <<EOF
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_${{ matrix.device }}=y
          # CONFIG_TARGET_MULTI_PROFILE is not set
          # CONFIG_TARGET_PER_DEVICE_ROOTFS is not set
          # CONFIG_TESTING_KERNEL is not set
          EOF
          if [ "${{ matrix.boot }}" = "wifi-no" ]; then
            cat >> .config <<'EOF'
          CONFIG_PACKAGE_kmod-ath=n
          CONFIG_PACKAGE_kmod-ath11k=n
          CONFIG_PACKAGE_kmod-ath11k-ahb=n
          CONFIG_PACKAGE_kmod-ath11k-pci=n
          CONFIG_PACKAGE_ath11k-firmware-ipq6018=n
          CONFIG_PACKAGE_ath11k-firmware-ipq6018-ddwrt=n
          CONFIG_PACKAGE_ath11k-firmware-qcn9074=n
          CONFIG_PACKAGE_wpad-openssl=n
          CONFIG_PACKAGE_ipq-wifi-zn_m2=n
          EOF
          fi
          make defconfig
          grep -qx 'CONFIG_LINUX_6_12=y' .config
          if grep -qx 'CONFIG_TESTING_KERNEL=y' .config; then
            echo 'testing kernel was selected; expected 6.12' >&2
            exit 1
          fi
          if ! grep -qx "CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_${{ matrix.device }}=y" .config \
            && ! grep -qx "CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_${{ matrix.device }}=y" .config; then
            echo "device ${{ matrix.device }} was not selected" >&2
            grep -E 'CONFIG_TARGET_.*DEVICE_' .config || true
            exit 1
          fi
          if [ "${{ matrix.boot }}" = "wifi-no" ]; then
            python3 - <<'PY'
          import re
          import sys
          from pathlib import Path
          text = Path("target/linux/qualcommax/image/ipq60xx.mk").read_text()
          block = re.search(r"(?ms)^define Device/zn_m2\n.*?^endef$", text)
          if not block or "FitImageLzma" not in block.group() or "\t$(call Device/FitImage)\n" in block.group():
              sys.exit("ZN M2 is not using FitImageLzma")
          if "UbiFit" not in block.group():
              sys.exit("ZN M2 lost its UBI layout")
          dtsi = Path("target/linux/qualcommax/files/arch/arm64/boot/dts/qcom/ipq6018-256m.dtsi").read_text()
          if "0x1000000" not in dtsi or "0x2800000" in dtsi:
              sys.exit("Q6 reservation was not reduced to 16MiB")
          PY
            for symbol in \
              CONFIG_PACKAGE_kmod-ath11k \
              CONFIG_PACKAGE_kmod-ath11k-ahb \
              CONFIG_PACKAGE_ath11k-firmware-ipq6018 \
              CONFIG_PACKAGE_wpad-openssl \
              CONFIG_PACKAGE_ipq-wifi-zn_m2
            do
              if grep -Eq "^${symbol}=[ym]$" .config; then
                echo "${symbol} is still selected" >&2
                exit 1
              fi
            done
            if ! grep -Eq '^CONFIG_PACKAGE_kmod-qca-nss-dp=[ym]$' .config; then
              echo 'NSS dataplane is missing; ZN M2 would boot without Ethernet' >&2
              exit 1
            fi
          fi
          mkdir -p build-info
          cp .config build-info/build.config
          ./scripts/diffconfig.sh > build-info/diffconfig.txt
          git rev-parse HEAD > build-info/source-commit.txt
          ./scripts/feeds list -s > build-info/feeds.txt
          {
            echo "BUILD_DATE=$(TZ=Asia/Shanghai date +%y.%m.%d-%H.%M)"
            echo "SOURCE_COMMIT=$(git rev-parse HEAD)"
          } >> "$GITHUB_ENV"

      - name: Download sources
        run: |
          set -euo pipefail
          make download -j8 2>&1 | tee build-info/download.log

      - name: Build firmware
        run: |
          set -euo pipefail
          { make -j"$(nproc)" || make -j1 V=s; } 2>&1 | tee build-info/build.log

      - name: Verify firmware output
        run: |
          set -euo pipefail
          dest=bin/targets/qualcommax/ipq60xx
          find "$dest" -maxdepth 1 -type f -printf '%s\t%p\n' | sort -n | tee build-info/images.txt
          if ! find "$dest" -maxdepth 1 -type f -name "*${{ matrix.device }}*sysupgrade*" -print -quit | grep -q .; then
            echo "missing sysupgrade image for ${{ matrix.device }}" >&2
            exit 1
          fi
          if [ "${{ matrix.boot }}" = "wifi-no" ]; then
            factory=$(find "$dest" -maxdepth 1 -type f -name "*${{ matrix.device }}*factory.ubi" -print -quit)
            if [ -z "$factory" ]; then
              echo 'missing ZN M2 factory.ubi' >&2
              exit 1
            fi
            size=$(stat -c%s "$factory")
            if [ "$size" -gt $((95 * 1024 * 1024)) ]; then
              echo "factory.ubi is ${size} bytes and cannot be uploaded by the stock U-Boot web recovery (95MiB)" >&2
              exit 1
            fi
          else
            if ! find "$dest" -maxdepth 1 -type f -name "*${{ matrix.device }}*factory.bin" -print -quit | grep -q .; then
              echo 'missing NN6000 v2 factory.bin' >&2
              exit 1
            fi
            itb=$(find "$dest" -maxdepth 1 -type f -name "*${{ matrix.device }}*uImage.itb" -print -quit || true)
            if [ -n "$itb" ]; then
              size=$(stat -c%s "$itb")
              if [ "$size" -gt $((6144 * 1024)) ]; then
                echo "NN6000 v2 kernel FIT is ${size} bytes, above the 6144k kernel partition" >&2
                exit 1
              fi
            fi
          fi

      - name: Stage release files
        run: |
          set -euo pipefail
          mkdir -p upload
          dest=bin/targets/qualcommax/ipq60xx
          find "$dest" -maxdepth 1 -type f \
            \( -name "*${{ matrix.device }}*" -o -name 'sha256sums' -o -name '*.manifest' -o -name '*.buildinfo' \) \
            ! -name 'packages' \
            -exec cp -t upload {} +
          cp build-info/build.config "upload/config-${{ matrix.profile }}-${BUILD_DATE}.txt"
          cp build-info/diffconfig.txt "upload/diffconfig-${{ matrix.profile }}-${BUILD_DATE}.txt"
          (
            cd upload
            sha256sum -- * > SHA256SUMS
          )
          if [ "${{ matrix.boot }}" = "wifi-no" ]; then
            cat > release-notes.md <<EOF
          LEDE 内核 6.12，单设备编译 ZN M2。

          上一版把 NN6000 v2 和 ZN M2 放进同一次 LEDE 默认 defconfig。ZN M2 只有 256MB 内存，那份固件仍带 ath11k，Q6 预留 40MB，内核 FIT 使用 gzip，刷入后无法启动。产物也只进了 Actions Artifacts，没有 GitHub Release。

          这次按 OpenWRT-CI_Self 的 ZN-M2-WIFI-NO 改到 LEDE 树：
          - 去掉 ath11k、对应固件、wpad 和 ipq-wifi-zn_m2
          - Q6 预留从 40MB 改为 16MB
          - 仅 ZN M2 的 FIT 改为 LZMA，NAND 仍是原来的 UbiFit
          - NSS 驱动保留，其它 LEDE 默认软件包保留
          - NN6000 v2 单独编译，不吃这些改动

          刷机：
          - U-Boot / 救砖：\`*-factory.ubi\`（原厂网页恢复不要超过 95MB）
          - 已经在 OpenWrt 里：\`*-sysupgrade.bin\`
          不要刷 NN6000 的 factory.bin。此版本故意不带无线。

          源码提交：${SOURCE_COMMIT}
          编译时间：${BUILD_DATE} Asia/Shanghai
          登录地址和密码沿用 LEDE 默认设置。
          EOF
          else
            cat > release-notes.md <<EOF
          LEDE 内核 6.12，单设备编译 Link NN6000 v2，使用 LEDE 默认包和默认 gzip FIT。

          不与 ZN M2 混编。ZN M2 需要单独的无无线 LZMA 固件，混在同一次默认配置里会把 ath11k 带进 256MB 的机器。

          刷机：
          - 首次 / 救砖：\`*-factory.bin\`
          - 系统内升级：\`*-sysupgrade.bin\`
          不要刷 ZN M2 的 factory.ubi。

          源码提交：${SOURCE_COMMIT}
          编译时间：${BUILD_DATE} Asia/Shanghai
          登录地址和密码沿用 LEDE 默认设置。
          EOF
          fi

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: lede-6.12-${{ matrix.profile }}-${{ env.BUILD_DATE }}
          path: |
            upload/
            release-notes.md
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lede-6.12-${{ matrix.profile }}-${{ env.BUILD_DATE }}-${{ github.run_id }}
          name: LEDE 6.12 ${{ matrix.profile }} ${{ env.BUILD_DATE }}
          body_path: release-notes.md
          files: |
            upload/*.bin
            upload/*.ubi
            upload/*.itb
            upload/*.manifest
            upload/*.buildinfo
            upload/*.txt
            upload/SHA256SUMS
          fail_on_unmatched_files: false
          make_latest: false
