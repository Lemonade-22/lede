name: LEDE IPQ60xx NN6000 v2 and ZN M2

on:
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: 'Optional extra package selections, one CONFIG_PACKAGE_* setting per line.'
        required: false
        type: string
      TEST:
        description: 'Generate and check .config without compiling firmware.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      WRT_CONFIG: DAEDE
      WRT_TEST: ${{ inputs.TEST }}
    steps:
      - name: Checkout LEDE
        uses: actions/checkout@v4
        with:
          path: lede

      - name: Checkout shared DAEDE configuration
        uses: actions/checkout@v4
        with:
          repository: Lemonade-22/OpenWRT-CI_Self
          ref: main
          path: ci-tools
          sparse-checkout: |
            Config/DAEDE.txt
            Scripts/DAEDE.sh

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3-setuptools rsync \
            swig unzip zlib1g-dev file wget curl time
          sudo timedatectl set-timezone Asia/Shanghai

      - name: Verify target and pin kernel 6.12
        working-directory: lede
        run: |
          set -euo pipefail
          grep -qx 'KERNEL_PATCHVER:=6.12' target/linux/qualcommax/Makefile
          echo "Using LEDE default kernel 6.12; testing kernel 6.18 is not selected."

      - name: Update and install feeds
        working-directory: lede
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure NN6000 v2 and ZN M2
        working-directory: lede
        env:
          EXTRA_PACKAGES: ${{ inputs.PACKAGE }}
        run: |
          set -euo pipefail
          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_TARGET_MULTI_PROFILE=y
          CONFIG_TARGET_PER_DEVICE_ROOTFS=y
          CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_link_nn6000-v2=y
          CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_zn_m2=y
          EOF
          cat ../ci-tools/Config/DAEDE.txt >> .config
          if [ -n "$EXTRA_PACKAGES" ]; then
            printf '%s\n' "$EXTRA_PACKAGES" >> .config
          fi
          bash ../ci-tools/Scripts/DAEDE.sh configure
          make defconfig
          bash ../ci-tools/Scripts/DAEDE.sh verify
          grep -qx 'CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_link_nn6000-v2=y' .config
          grep -qx 'CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_zn_m2=y' .config
          mkdir -p artifact
          cp .config artifact/lede-ipq60xx-nn6000-v2-zn-m2.config

      - name: Download packages
        if: ${{ !inputs.TEST }}
        working-directory: lede
        run: make download -j"$(nproc)"

      - name: Compile firmware
        if: ${{ !inputs.TEST }}
        working-directory: lede
        run: make -j"$(nproc)" || make -j1 V=s

      - name: Collect firmware and build information
        if: ${{ !inputs.TEST }}
        working-directory: lede
        run: |
          set -euo pipefail
          cp -a bin/targets/qualcommax/ipq60xx artifact/firmware
          mkdir -p artifact/buildinfo
          find bin/targets/qualcommax/ipq60xx -maxdepth 1 -type f \
            \( -name '*.manifest' -o -name '*.buildinfo' \) \
            -exec cp -t artifact/buildinfo {} +

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lede-ipq60xx-nn6000-v2-zn-m2
          path: lede/artifact/
          if-no-files-found: error
          retention-days: 14
