name: OpenWrt-CI - ZN-M2 WIFI-NO

on:
  workflow_dispatch:
  schedule:
    - cron: 0 20 * * *

concurrency:
  group: zn-m2-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:

  build_openwrt:

    name: Build ZN-M2 Firmware

    runs-on: ubuntu-22.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash

    steps:
      - name: Space cleanup and Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker image prune -f
          sudo -E rm -rf /usr/share/dotnet /etc/mysql /etc/php /etc/apt/sources.list.d /usr/local/lib/android
          sudo -E apt-mark hold grub-efi-amd64-signed
          sudo -E apt update
          sudo -E apt -y purge azure-cli* docker* ghc* zulu* llvm* firefox google* dotnet* powershell* openjdk* mysql* php* mongodb* dotnet* snap*
          sudo -E apt -y full-upgrade
          sudo -E apt -y install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib gettext genisoimage git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool llvm lrzsz msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          sudo -E systemctl daemon-reload
          sudo -E apt -y autoremove --purge
          sudo -E apt clean
          sudo -E timedatectl set-timezone "Asia/Shanghai"

      - name: Checkout OpenWrt
        uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: true
          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Update feeds
        run: |
          sed -i 's/#src-git helloworld/src-git helloworld/g' ./feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Check ZN-M2 RAM compatibility
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          root = Path("target/linux/qualcommax")
          dts = root / "files/arch/arm64/boot/dts/qcom"
          board = (dts / "ipq6018-m2.dts").read_text()
          cmiot = (dts / "ipq6018-cmiot.dtsi").read_text()
          def require(condition, message):
              if not condition:
                  raise SystemExit(message)
          require('#include "ipq6018-cmiot.dtsi"' in board, "Unexpected ZN-M2 DTS include")
          require("ipq6018-viking-cmiot.dtsi" not in board, "ZN-M2 still uses the VIKING PCS DTS")
          require('#include "ipq6018-ess.dtsi"' in cmiot, "Missing LEDE ESS DTS")
          require("&uniphy0" not in cmiot and "pcs-handle" not in cmiot,
                  "ZN-M2 DTS uses OpenWrt PCS bindings")
          # ipq6018-512m.dtsi only resizes the Q6 reservation. U-Boot supplies DRAM.
          seen = set()
          def check_includes(path):
              if path in seen:
                  return
              seen.add(path)
              text = path.read_text()
              require("&uniphy0" not in text and "pcs-handle" not in text,
                      f"OpenWrt PCS binding in {path.name}")
              require(not re.search(r'\bmem=|\blinux,usable-memory|(?<![\w-])memory(?:@[0-9a-fA-F]+)?\s*\{|&memory\s*\{', text),
                      f"Fixed RAM override in {path}")
              for name in re.findall(r'#include\s+"([^"]+)"', text):
                  child = path.parent / name
                  if child.is_file():
                      check_includes(child)
          check_includes(dts / "ipq6018-m2.dts")
          require('qcom,ath11k-fw-memory-mode = <1>;' in cmiot, "Missing ath11k memory profile")
          require('compatible = "qcom,smem-part";' in cmiot, "Missing SMEM NAND partitions")
          require('#include "ipq6018-512m.dtsi"' in cmiot, "Missing 512 MiB Q6 reservation")
          image = (root / "image/ipq60xx.mk").read_text()
          match = re.search(r"(?ms)^define Device/zn_m2\n.*?^endef$", image)
          require(match is not None, "Missing ZN-M2 image profile")
          block = match.group()
          for value in ("$(call Device/FitImage)", "$(call Device/UbiFit)",
                        "DEVICE_DTS := ipq6018-m2", "DEVICE_DTS_CONFIG := config@cp03-c1"):
              require(value in block, f"Unexpected ZN-M2 image profile: {value}")
          print("ZN-M2: LEDE NSS switch DTS, bootloader-supplied RAM")
          PY

      - name: Remove wireless defaults and LuCI pages
        run: python3 .github/ci/zn-m2-wifi-no.py prepare

      - name: Generate configuration file
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq60xx=y
          CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_zn_m2=y
          # CONFIG_TARGET_MULTI_PROFILE is not set
          # CONFIG_TARGET_PER_DEVICE_ROOTFS is not set
          # CONFIG_TESTING_KERNEL is not set
          EOF
          make defconfig
          mkdir -p ./artifact/buildinfo
          python3 .github/ci/zn-m2-wifi-no.py configure
          make defconfig
          cp .config ./artifact/buildinfo/config.txt
          ./scripts/diffconfig.sh > ./artifact/buildinfo/diffconfig.txt
          git rev-parse HEAD > ./artifact/buildinfo/source-commit.txt
          ./scripts/feeds list -s > ./artifact/buildinfo/feeds.txt
          python3 - <<'PY'
          from pathlib import Path
          config = set(Path(".config").read_text().splitlines())
          required = (
              "CONFIG_TARGET_qualcommax=y",
              "CONFIG_TARGET_qualcommax_ipq60xx=y",
              "CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_zn_m2=y",
          )
          missing = [line for line in required if line not in config]
          for line in missing:
              print(f"::error::Required configuration missing after make defconfig: {line}")
          if missing:
              raise SystemExit(1)
          print("ZN-M2 target verified")
          PY
          python3 .github/ci/zn-m2-wifi-no.py verify

      - name: Download packages
        run: make download -j16

      - name: Compile firmware
        run: |
          make -j$(nproc) || make -j1 V=s
          echo "======================="
          echo "Space usage:"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1 ./ --exclude=build_dir --exclude=bin
          du -h --max-depth=1 ./build_dir
          du -h --max-depth=1 ./bin

      - name: Verify ZN-M2 firmware
        run: |
          python3 .github/ci/zn-m2-wifi-no.py manifest
          dest=bin/targets/qualcommax/ipq60xx
          find "$dest" -maxdepth 1 -type f -name '*-zn_m2-*-factory.ubi' -print -quit | grep -q .
          find "$dest" -maxdepth 1 -type f -name '*-zn_m2-*-sysupgrade.bin' -print -quit | grep -q .

      - name: Prepare artifact
        run: |
          mkdir -p ./artifact/package
          mkdir -p ./artifact/buildinfo
          find ./bin/targets/ -type d -name packages -prune -exec rm -rf {} +
          find ./bin/packages/ -type f -name '*.ipk' -exec cp -t ./artifact/package/ {} +
          find ./bin/targets/ -type f \( -name '*.buildinfo' -o -name '*.manifest' \) -exec cp -t ./artifact/buildinfo/ {} +

      - name: Upload buildinfo
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ZN-M2_WIFI-NO_buildinfo
          path: ./artifact/buildinfo/

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ZN-M2_WIFI-NO_package
          path: ./artifact/package/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ZN-M2_WIFI-NO_firmware
          path: ./bin/targets/qualcommax/ipq60xx/
          if-no-files-found: error
